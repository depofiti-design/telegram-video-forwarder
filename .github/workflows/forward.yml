name: Forward archive videos

on:
  workflow_dispatch: {}
  schedule:
    # All times UTC. Turkey is UTC+3 year-round (no DST).
    - cron: "0 6 * * *"    # 09:00 TR
    - cron: "30 7 * * *"   # 10:30 TR
    - cron: "0 9 * * *"    # 12:00 TR
    - cron: "0 11 * * *"   # 14:00 TR
    - cron: "30 12 * * *"  # 15:30 TR
    - cron: "0 14 * * *"   # 17:00 TR
    - cron: "30 15 * * *"  # 18:30 TR
    - cron: "30 17 * * *"  # 20:30 TR
    - cron: "30 19 * * *"  # 22:30 TR
    - cron: "30 21 * * *"  # 00:30 TR (next day)
    - cron: "30 23 * * *"  # 02:30 TR (next day)

permissions:
  contents: write

concurrency:
  group: forward-videos
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send batch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_CHANNEL_ID: ${{ secrets.SOURCE_CHANNEL_ID }}
          TARGET_CHANNEL_IDS: ${{ secrets.TARGET_CHANNEL_IDS }}
          STAGING_CHAT_ID: ${{ secrets.STAGING_CHAT_ID }}
        run: python send.py

      - name: Commit updated state
        run: |
          git config user.name "forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push